<script>
// Operational calendar is always Jakarta/WIB, regardless of the device timezone.
function jakartaISODate(date = new Date()) {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(date);
  const part = type => parts.find(p => p.type === type).value;
  return `${part('year')}-${part('month')}-${part('day')}`;
}
// Database audit timestamps are stored in UTC (PostgreSQL/SQLite CURRENT_TIMESTAMP).
// Render them as WIB explicitly so the display does not depend on the browser timezone.
function formatJakartaDateTime(value) {
  if (!value) return '-';
  let raw = String(value).trim();
  if (!raw) return '-';
  let normalized = raw.includes('T') ? raw : raw.replace(' ', 'T');
  // PostgreSQL may emit offsets as +00; normalize them to ISO's +00:00 form.
  normalized = normalized.replace(/([+-]\d{2})$/, '$1:00');
  // Legacy/default DB timestamp strings can omit an offset; CURRENT_TIMESTAMP is UTC.
  const hasExplicitZone = /T.*(?:Z|[+-]\d{2}:?\d{2})$/i.test(normalized);
  if (!hasExplicitZone) normalized += 'Z';
  const parsed = new Date(normalized);
  if (!Number.isFinite(parsed.getTime())) return String(value);
  return new Intl.DateTimeFormat('id-ID', {
    timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
  }).format(parsed);
}
function closeModal() { if (window.qrisPaymentModalActive) return; document.getElementById('modalOverlay').style.display = 'none'; }

  const trx = await api('GET', `/pos/transactions/${id}`);

    <table>${trx.items.map(i=>`<tr><td>${i.menu_name} x${i.quantity}${i.notes ? `<div class="muted" style="font-size:12px;margin-top:3px;">Notes/Description: ${String(i.notes).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}</div>` : ''}</td><td>${rupiah(i.price*i.quantity)}</td></tr>`).join('')}</table>
    <div class="cart-row" style="font-weight:700;border-top:1px solid #eee;padding-top:6px;"><span>Total</span><span>${rupiah(trx.grand_total)}</span></div>
    ${trx.payment_method==='CASH'?`<div class="cart-row"><span>Dibayar</span><span>${rupiah(trx.paid_amount)}</span></div><div class="cart-row"><span>Kembalian</span><span>${rupiah(trx.change_amount)}</span></div>`:''}
  `;
  document.getElementById('modalOverlay').style.display = 'block';
}
let me = null;
async function logout() { await api('POST', '/auth/logout'); window.location.href = '/index.html'; }
function setActiveTab(tab) { document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab)); }

// ---------------- Dashboard ----------------
let dashFrom = null, dashTo = null;
// Utilities page total: shown plainly (no minus sign) — just the magnitude.
function formatUtilitiesAmount(amount) {
  return rupiah(Math.abs(amount));
}
// Dashboard Total Utilities card: net pemasukan (kredit) dikurangi pengeluaran (debit)
// dari sudut pandang kas masuk — jadi tandanya KEBALIKAN dari variabel backend
// `totalUtilities` (yang dihitung sebagai net pengeluaran: debit - kredit + gaji).
// Pengeluaran dominan -> "-Rp...", pemasukan dominan -> "+Rp..." (selalu pakai tanda).
//   debit 50rb saja            -> -Rp50.000
//   kredit 10rb saja           -> +Rp10.000
//   kredit 10rb, debit 50rb    -> -Rp40.000
//   kredit 50rb, debit 10rb    -> +Rp40.000
function formatSignedRupiah(totalUtilities) {
  const netIncoming = -totalUtilities;
  const sign = netIncoming < 0 ? '-' : '+';
  return sign + rupiah(Math.abs(netIncoming));
}
function barChartHtml(data, color) {
  if (!data.length) return '<p class="muted">Tidak ada data.</p>';
  const max = Math.max(...data.map(d => d.qty), 1);
  return `<div style="display:flex;flex-direction:column;gap:8px;">
    ${data.map(d => `
      <div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px;">
          <span>${d.name}</span><span class="muted">${d.qty}</span>
        </div>
        <div style="background:#f1e9e0;border-radius:6px;height:14px;overflow:hidden;">
          <div style="background:${color};height:100%;width:${Math.max(4, (d.qty/max)*100)}%;border-radius:6px;"></div>
        </div>
      </div>`).join('')}
  </div>`;
}
async function renderDashboard() {
  const today = jakartaISODate();
  if (!dashFrom) dashFrom = today;
  if (!dashTo) dashTo = today;
  const d = await api('GET', `/admin/dashboard?from=${dashFrom}&to=${dashTo}`);
  document.getElementById('view').innerHTML = `
    <h2>Dashboard</h2>
    <div class="card">
      <label>Dari</label><input id="dashFrom" type="date" value="${dashFrom}">
      <label>Sampai</label><input id="dashTo" type="date" value="${dashTo}">
      <button onclick="applyDashFilter()">Terapkan</button>
    </div>
    <div class="grid3">
      <div class="card kpi"><div class="value">${rupiah(d.pendapatanBersih)}</div><div class="label">Pendapatan Bersih</div></div>
      <div class="card kpi"><div class="value">${formatSignedRupiah(d.totalUtilities)}</div><div class="label">Total Utilities</div></div>
      <div class="card kpi"><div class="value">${rupiah(d.cashTotal)}</div><div class="label">Pendapatan Cash</div></div>
      <div class="card kpi"><div class="value">${rupiah(d.qrisTotal)}</div><div class="label">Pendapatan QRIS</div></div>
      <div class="card kpi"><div class="value">${d.totalPcs}</div><div class="label">Jumlah Pcs Dimsum Terjual</div></div>
      <div class="card kpi"><div class="value">${d.salesRange.cnt}</div><div class="label">Jumlah Transaksi (PAID)</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Produk / Menu Terlaris</h3>${barChartHtml(d.bestSellers, '#d9480f')}</div>
      <div class="card"><h3>Produk / Menu Paling Sedikit Terjual</h3>${barChartHtml(d.worstSellers, '#a8a29a')}</div>
    </div>
    <div class="card"><h3>Item Perlu Restock</h3><table><tr><th>Item</th><th>Current</th><th>Minimum</th><th>Suggested</th></tr>
      ${d.restockSuggestions.map(i=>`<tr><td>${i.name}</td><td>${i.current_stock} ${i.unit}</td><td>${i.minimum_stock} ${i.unit}</td><td>${i.suggested_purchase}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Tidak ada item yang perlu direstock.</td></tr>'}
    </table></div>
  `;
}
function applyDashFilter() {
  dashFrom = document.getElementById('dashFrom').value;
  dashTo = document.getElementById('dashTo').value;
  renderDashboard();
}

// ---------------- POS (Admin can also transact / manual entry) ----------------
let menuList = [], cart = [];
async function renderPos() {
  if (!menuList.length) menuList = await api('GET', '/pos/menu-active');
  let html = '<h2>POS</h2><div class="grid2"><div class="card"><h3>Menu</h3>';
  for (const m of menuList) {
    const inCart = cart.find(c => c.menu.id === m.id);
    html += `<div class="menu-item"><div>${m.name}<br><span class="muted">${rupiah(m.price)}</span></div>
      <div class="qty-ctrl"><button onclick="posQty(${m.id},-1)">−</button><span>${inCart?inCart.qty:0}</span><button onclick="posQty(${m.id},1)">+</button></div></div>`;
  }
  html += '</div><div class="card"><h3>Cart</h3>';
  const subtotal = cart.reduce((s,c)=>s+c.menu.price*c.qty,0);
  for (const c of cart) html += `<div class="cart-row"><span>${c.menu.name} x${c.qty}</span><span>${rupiah(c.menu.price*c.qty)}</span></div>`;
  html += `<div class="cart-row" style="font-weight:700;border-top:1px solid #eee;padding-top:6px;"><span>Total</span><span>${rupiah(subtotal)}</span></div>
    <div class="grid2"><button onclick="posPay('CASH')">Cash</button><button onclick="posPay('QRIS')">QRIS</button></div>
    <button class="secondary" style="margin-top:8px;" onclick="posManual()">Input Transaksi Manual</button>
    <button class="secondary" style="margin-top:8px;" onclick="openBulkManualTrx()">Upload Bulk Transaksi Manual (Excel)</button>
    <div id="posErr" class="error"></div></div></div>`;
  document.getElementById('view').innerHTML = html;
}
function posQty(id, delta) {
  // PostgreSQL BIGINT values are commonly returned as strings; inline onclick IDs are numbers.
  // Compare IDs as strings so the +/− controls work for both admin and staff datasets.
  const menu = menuList.find(m => String(m.id) === String(id));
  if (!menu) {
    const err = document.getElementById('posErr');
    if (err) err.textContent = 'Menu tidak ditemukan. Muat ulang halaman POS.';
    return;
  }
  let e = cart.find(c => String(c.menu.id) === String(id));
  if (!e) { if (delta > 0) cart.push({ menu, qty: 1 }); }
  else { e.qty += delta; if (e.qty <= 0) cart = cart.filter(c => String(c.menu.id) !== String(id)); }
  renderPos();
}
async function posPay(method) {
  const items = cart.map(c=>({menu_id:c.menu.id, quantity:c.qty}));
  const subtotal = cart.reduce((s,c)=>s+c.menu.price*c.qty,0);
  let payment = { method };
  if (method === 'CASH') {
    const p = await promptCashPayment(subtotal);
    if (p==null) return;
    const paid = Number(p);
    if (!Number.isFinite(paid) || paid < subtotal) { document.getElementById('posErr').textContent = `Nominal cash tidak boleh kurang dari total (${rupiah(subtotal)}).`; return; }
    payment.paid_amount = paid;
  }
  try {
    const r = await api('POST','/pos/checkout', { items, payment, idempotencyKey: 'admin-'+Date.now() });
    cart = [];
    if (method === 'QRIS' && r.transaction.payment_status === 'PENDING') {
      renderPos();
      const finalTrx = await payWithQris(r.transaction.id, r.transaction.trx_no, r.transaction.grand_total);
      if (finalTrx) await alertDialog(`Transaksi ${finalTrx.trx_no} berhasil dibayar via QRIS.`);
      return;
    }
    await alertDialog(`${r.transaction.trx_no} - ${r.transaction.payment_status}`); renderPos();
  } catch(e) { document.getElementById('posErr').textContent = e.message; }
}
async function posManual() {
  const items = cart.map(c=>({menu_id:c.menu.id, quantity:c.qty}));
  if (!items.length) return alertDialog('Tambahkan item dulu.');
  const subtotal = cart.reduce((s,c)=>s+c.menu.price*c.qty,0);
  const today = jakartaISODate();
  const form = await promptDialog('Transaksi Manual', [
    { name: 'transactionDate', label: `Tanggal transaksi (total: ${rupiah(subtotal)})`, type: 'date', value: today },
    { name: 'method', label: 'Metode pembayaran', type: 'select', value: 'CASH', options: [{value:'CASH',label:'Cash'},{value:'QRIS',label:'QRIS'}] },
  ]);
  if (!form) return;
  const method = form.method === 'QRIS' ? 'QRIS' : 'CASH';
  let payment = { method, status: 'PAID' };
  if (method === 'CASH') {
    const paid = await promptCashPayment(subtotal);
    if (paid == null) return;
    payment.paid_amount = Number(paid);
  }
  try {
    const trx = await api('POST','/pos/manual', { items, payment, transactionDate: form.transactionDate || undefined });
    cart = []; await alertDialog(`Manual transaction ${trx.trx_no} tercatat (tanggal ${trx.date}).`); renderPos();
  } catch(e) { document.getElementById('posErr').textContent = e.message; }
}
async function openBulkManualTrx() {
  const xlsxBase64 = await uploadExcelDialog('Upload Bulk Transaksi Manual',
    'Kolom wajib: menu_name, quantity. date, time, payment_method, paid_amount, notes opsional. Setiap baris akan menjadi satu transaksi.',
    '/api/pos/manual/bulk/template.xlsx');
  if (!xlsxBase64) return;
  try {
    const r = await api('POST', '/pos/manual/bulk', { xlsxBase64 });
    const errMsg = r.errors.length ? `\n${r.errors.length} baris gagal: ` + r.errors.map(e=>`baris ${e.row}: ${e.error}`).join('; ') : '';
    await alertDialog(`${r.createdCount} transaksi berhasil dibuat.${errMsg}`);
    renderPos();
  } catch (e) { await alertDialog('Gagal upload: ' + e.message); }
}

// Transactions defaults to the current local date; user can widen the range with filters.
function localISODate() {
  return jakartaISODate();
}
let trxFilters = { from: localISODate(), to: localISODate(), paymentMethod: '', paymentStatus: '', cashierId: '' };

async function renderTransactions() {
  const view = document.getElementById('view');
  view.innerHTML = '<div class="card">Memuat data transaksi hari ini...</div>';
  try {
  const cashiers = await api('GET', '/pos/cashiers');
  const query = new URLSearchParams();
  if (trxFilters.from && trxFilters.to) { query.set('from', trxFilters.from); query.set('to', trxFilters.to); }
  if (trxFilters.paymentMethod) query.set('paymentMethod', trxFilters.paymentMethod);
  if (trxFilters.paymentStatus) query.set('paymentStatus', trxFilters.paymentStatus);
  if (trxFilters.cashierId) query.set('cashierId', trxFilters.cashierId);
  const { rows: trx, summary } = await api('GET', `/pos/transactions?${query.toString()}`);
  const tagClass = s => s==='PAID'?'paid':s==='VOID'?'void':'pending';
  const exportUrl = `/api/pos/transactions/export?${query.toString()}`;
  document.getElementById('view').innerHTML = `<h2>Transactions</h2>
    <div class="card">
      <div class="grid2">
        <div><label>Dari Tanggal</label><input id="trxFilterFrom" type="date" value="${trxFilters.from}"></div>
        <div><label>Sampai Tanggal</label><input id="trxFilterTo" type="date" value="${trxFilters.to}"></div>
      </div>
      <div class="grid3" style="margin-top:8px;">
        <select id="trxFilterMethod">
          <option value="">Semua Metode</option>
          <option value="CASH" ${trxFilters.paymentMethod==='CASH'?'selected':''}>Cash</option>
          <option value="QRIS" ${trxFilters.paymentMethod==='QRIS'?'selected':''}>QRIS</option>
        </select>
        <select id="trxFilterStatus">
          <option value="">Semua Status</option>
          <option value="PAID" ${trxFilters.paymentStatus==='PAID'?'selected':''}>PAID</option>
          <option value="PENDING" ${trxFilters.paymentStatus==='PENDING'?'selected':''}>PENDING</option>
          <option value="VOID" ${trxFilters.paymentStatus==='VOID'?'selected':''}>VOID</option>
          <option value="FAILED" ${trxFilters.paymentStatus==='FAILED'?'selected':''}>FAILED</option>
          <option value="CANCELLED" ${trxFilters.paymentStatus==='CANCELLED'?'selected':''}>CANCELLED</option>
        </select>
        <select id="trxFilterCashier">
          <option value="">Semua Kasir</option>
          ${cashiers.map(c=>`<option value="${c.id}" ${String(trxFilters.cashierId)===String(c.id)?'selected':''}>${c.username}</option>`).join('')}
        </select>
      </div>
      <button onclick="applyTrxFilters()" style="margin-top:8px;">Terapkan Filter</button>
      <a class="btn" style="text-decoration:none;display:inline-block;margin-top:8px;margin-left:8px;" href="${exportUrl}" target="_blank">⬇ Download Excel</a>
    </div>
    <div class="card"><table>
    <tr><th>No</th><th>Tanggal</th><th>Kasir</th><th>Total</th><th>Metode</th><th>Status</th><th>Aksi</th></tr>
    ${trx.map(t=>`<tr>
      <td style="cursor:pointer;" onclick="showTrxDetail(${t.id})">${t.trx_no}</td>
      <td style="cursor:pointer;" onclick="showTrxDetail(${t.id})">${t.date} ${t.time}</td>
      <td style="cursor:pointer;" onclick="showTrxDetail(${t.id})">${t.cashier_name || '-'}</td>
      <td style="cursor:pointer;" onclick="showTrxDetail(${t.id})">${rupiah(t.grand_total)}</td>
      <td style="cursor:pointer;" onclick="showTrxDetail(${t.id})">${t.payment_method}</td>
      <td style="cursor:pointer;" onclick="showTrxDetail(${t.id})"><span class="tag ${tagClass(t.payment_status)}">${t.payment_status}</span></td>
      <td>${t.payment_status==='PAID'?`<button class="secondary" style="padding:4px 8px;" onclick="voidTrx(${t.id})">Void</button>`:''}</td></tr>`).join('')}
    ${!trx.length ? '<tr><td colspan="7" class="muted">Tidak ada transaksi.</td></tr>' : ''}
    <tr style="font-weight:700;border-top:2px solid #ddd;"><td colspan="3">TOTAL PENDAPATAN (PAID)</td><td>${rupiah(summary.totalRevenue)}</td><td colspan="3"></td></tr>
    </table></div>`;
  } catch (e) {
    view.innerHTML = `<div class="card error"><h2>Transactions</h2><p>Gagal memuat transaksi: ${String(e.message || e).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p><button onclick="renderTransactions()">Coba Lagi</button></div>`;
  }
}
function applyTrxFilters() {
  trxFilters.from = document.getElementById('trxFilterFrom').value;
  trxFilters.to = document.getElementById('trxFilterTo').value;
  trxFilters.paymentMethod = document.getElementById('trxFilterMethod').value;
  trxFilters.paymentStatus = document.getElementById('trxFilterStatus').value;
  trxFilters.cashierId = document.getElementById('trxFilterCashier').value;
  renderTransactions();
}
async function voidTrx(id) {
  const reason = await promptSingle('Alasan void:', '');
  if (reason==null) return;
  try { await api('POST', `/pos/${id}/void`, { reason }); renderTransactions(); } catch(e) { await alertDialog(e.message); }
}

// ---------------- Menu ----------------
async function renderMenu() {
  const menus = await api('GET','/menu');
  document.getElementById('view').innerHTML = `<h2>Menu</h2>
    <div class="card"><h3 id="menuFormTitle">Tambah Menu</h3>
      <input type="hidden" id="mId">
      <input id="mName" placeholder="Nama menu">
      <input id="mCategory" placeholder="Kategori (contoh: Dimsum)">
      <input id="mPrice" type="number" placeholder="Harga">
      <input id="mPcs" type="number" placeholder="Jumlah pcs dimsum">
      <button onclick="saveMenu()">Simpan</button>
      <button class="secondary" id="mCancelBtn" style="display:none;" onclick="resetMenuForm()">Batal Edit</button>
    </div>
    <div class="card"><table><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Pcs</th><th>Status</th><th>Aksi</th></tr>
    ${menus.map(m=>`<tr><td>${m.name}</td><td>${m.category||'-'}</td><td>${rupiah(m.price)}</td><td>${m.pcs_per_unit}</td>
      <td>${m.active?'Aktif':'Nonaktif'}</td>
      <td>
        <button class="secondary" style="padding:4px 8px;" onclick='editMenu(${JSON.stringify(m).replace(/'/g,"&apos;")})'>Edit</button>
        <button class="secondary" style="padding:4px 8px;" onclick="toggleMenu(${m.id},${m.active?0:1})">${m.active?'Nonaktifkan':'Aktifkan'}</button>
        <button class="secondary" style="padding:4px 8px;color:#c0392b;" onclick="deleteMenu(${m.id})">Hapus</button>
        <button class="secondary" style="padding:4px 8px;" onclick="location.hash='recipe'; setTimeout(()=>selectRecipeMenu(${m.id}),50)">Recipe</button>
      </td></tr>`).join('')}
    </table></div>`;
}
function editMenu(m) {
  document.getElementById('menuFormTitle').textContent = 'Edit Menu: ' + m.name;
  document.getElementById('mId').value = m.id;
  document.getElementById('mName').value = m.name;
  document.getElementById('mCategory').value = m.category || '';
  document.getElementById('mPrice').value = m.price;
  document.getElementById('mPcs').value = m.pcs_per_unit;
  document.getElementById('mCancelBtn').style.display = 'inline-block';
  window.scrollTo(0,0);
}
function resetMenuForm() { renderMenu(); }
async function saveMenu() {
  const id = document.getElementById('mId').value;
  const payload = {
    name: document.getElementById('mName').value,

async function openManualAttendanceDialog() {

  document.getElementById('modalBody').innerHTML = `

    <label>Jam Check-out (opsional)</label>
    <input id="maCheckOut" type="time">
    <label>Foto Check-in (opsional)</label>
    <input id="maPhotoIn" type="file" accept="image/*">
    <label>Foto Check-out (opsional)</label>
    <input id="maPhotoOut" type="file" accept="image/*">
    <button type="button" class="secondary" onclick="captureManualLocation()" style="margin-top:4px;">📍 Ambil Lokasi Sekarang (opsional)</button>
    <div id="maLocStatus" class="muted" style="font-size:12px;margin:4px 0;">Lokasi belum diambil.</div>
    <label>Catatan (opsional)</label>
    <textarea id="maNote" rows="2"></textarea>
    <div id="maErr" class="error"></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button type="button" class="secondary" style="flex:1;" onclick="closeModal()">Batal</button>
      <button type="button" style="flex:1;" onclick="submitManualAttendance()">Simpan</button>
    </div>`;
  document.getElementById('modalOverlay').style.display = 'block';
  window._maLat = null; window._maLng = null;
}
function captureManualLocation() {
  if (!navigator.geolocation) { document.getElementById('maLocStatus').textContent = 'Geolocation tidak didukung browser ini.'; return; }
  document.getElementById('maLocStatus').textContent = 'Mengambil lokasi...';
  navigator.geolocation.getCurrentPosition(
    pos => { window._maLat = pos.coords.latitude; window._maLng = pos.coords.longitude; document.getElementById('maLocStatus').textContent = `Lokasi diambil: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`; },
    () => { document.getElementById('maLocStatus').textContent = 'Gagal mengambil lokasi.'; },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}
function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function submitManualAttendance() {
  const employeeId = Number(document.getElementById('maEmp').value);
  const date = document.getElementById('maDate').value;
  const checkIn = document.getElementById('maCheckIn').value;
  const checkOut = document.getElementById('maCheckOut').value;
  const note = document.getElementById('maNote').value;
  const photoInFile = document.getElementById('maPhotoIn').files[0];
  const photoOutFile = document.getElementById('maPhotoOut').files[0];
  if (!date) { document.getElementById('maErr').textContent = 'Tanggal wajib diisi.'; return; }
  if (!checkIn && !checkOut) { document.getElementById('maErr').textContent = 'Isi minimal jam check-in atau check-out.'; return; }
  try {
    const checkInPhoto = photoInFile ? await readFileAsDataUrl(photoInFile) : undefined;
    const checkOutPhoto = photoOutFile ? await readFileAsDataUrl(photoOutFile) : undefined;
    await api('POST', '/attendance/manual', {
      employeeId, date,
      checkIn: checkIn ? checkIn + ':00' : undefined,
      checkOut: checkOut ? checkOut + ':00' : undefined,
      checkInPhoto, checkOutPhoto,
      checkInLat: window._maLat || undefined, checkInLng: window._maLng || undefined,
      note: note || undefined,
    });
    closeModal();
    renderAttendance();
  } catch (e) {
    document.getElementById('maErr').textContent = e.message;
  }
}

    { name: 'role_id', label: 'Role', type: 'select', value: currentRoleId, options: roles.map(r=>({value:r.id,label:r.name})) },
  ]);
  if (!form) return;
  const payload = {};
  if (form.username && form.username !== currentUsername) payload.username = form.username;
  if (form.password) payload.password = form.password;
  if (Number(form.role_id) !== Number(currentRoleId)) payload.role_id = Number(form.role_id);
  if (Object.keys(payload).length) { await api('PUT', `/admin/users/${id}`, payload); renderUsers(); }
}
async function deleteUser(id) {
  const ok = await confirmDialog('Hapus user ini? Jika memiliki riwayat transaksi/aktivitas, hanya akan dinonaktifkan.');
  if (!ok) return;
  try {
    const r = await api('DELETE', `/admin/users/${id}`);
    if (r.softDeleted) await alertDialog(r.message);
    renderUsers();
  } catch (e) { await alertDialog(e.message); }
}
async function toggleUser(id, active) { await api('PUT', `/admin/users/${id}`, { active }); renderUsers(); }
async function addUser() {
  await api('POST','/admin/users', { username: document.getElementById('uUsername').value, password: document.getElementById('uPassword').value,
    role_id: Number(document.getElementById('uRole').value), employee_id: document.getElementById('uEmp').value ? Number(document.getElementById('uEmp').value) : null });
  renderUsers();
}

async function renderRoles() {
  const [roles, perms] = await Promise.all([api('GET','/admin/roles'), api('GET','/admin/permissions')]);
  document.getElementById('view').innerHTML = `<h2>Roles & Permissions</h2>` + roles.map(r => `
    <div class="card"><h3>${r.name}</h3>
      ${perms.map(p => `<label style="display:inline-block;width:220px;font-size:13px;"><input type="checkbox" class="perm-${r.id}" value="${p.code}" ${r.permissions.includes(p.code)?'checked':''}> ${p.code}</label>`).join('')}
      <div><button onclick="saveRolePerms(${r.id})" style="margin-top:8px;">Simpan</button></div>
    </div>`).join('');
}
async function saveRolePerms(roleId) {
  const checks = document.querySelectorAll(`.perm-${roleId}`);
  const permissionCodes = Array.from(checks).filter(c=>c.checked).map(c=>c.value);
  await api('PUT', `/admin/roles/${roleId}/permissions`, { permissionCodes });
  await alertDialog('Permission disimpan.');
}

// ---------------- Settings ----------------
function escapeHtmlAttr(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
const settingLabels = { CHILI_OIL_ML_PER_4PCS: 'Chili Oil — menu 4 pcs (ml)', CHILI_OIL_ML_PER_6PCS: 'Chili Oil — menu 6 pcs (ml)', SAUCE_PEDAS_GRAMS_PER_4PCS: 'Saus Pedas — menu 4 pcs (g)', SAUCE_PEDAS_GRAMS_PER_6PCS: 'Saus Pedas — menu 6 pcs (g)', SAUCE_MENTAI_GRAMS_PER_PORTION: 'Saus Mentai — per porsi (g)', SAUCE_GARLIC_GRAMS_PER_PORTION: 'Saus Garlic — per porsi (g)' };
async function renderSettings() {
  const settings = await api('GET','/admin/settings');
  const isMultiline = (key) => key.includes('PRIVATE_KEY') || key.includes('PEM') || key === 'QRIS_STATIC_PAYLOAD';
  document.getElementById('view').innerHTML = `<h2>Settings (Business Rules)</h2>
    <div class="card"><h3 style="margin-top:0;">Takaran Bahan Resep</h3><p class="muted" style="font-size:12px;">Takaran saus di sini langsung memperbarui BOM Recipes aktif dan menjadi acuan pengurangan stok saat transaksi. Chili Oil menggunakan ml; saus kental menggunakan gram (stok saus tetap tersimpan dalam kg, dikonversi otomatis).</p><table><tr><th>Bahan / cakupan</th><th>Takaran</th><th></th></tr>${settings.filter(s=>settingLabels[s.key]).map(s=>`<tr><td>${settingLabels[s.key]}</td><td><input type="number" min="0.01" step="0.01" value="${escapeHtmlAttr(s.value)}" id="set-${s.key}" style="margin:0;max-width:160px;"></td><td><button class="secondary" style="padding:4px 8px;" onclick="saveSetting('${s.key}')">Simpan</button></td></tr>`).join('')}</table></div>
    <div class="card">
      <h3 style="margin-top:0;">QRIS Dinamis — Invoice dari QRIS Interactive Mobile App</h3>
      <p class="muted" style="font-size:12px;">Mode ini memakai API mobile app QRIS Interactive yang tidak resmi/didokumentasikan publik, bukan Open API berbayar dan bukan konversi QR lokal. Endpoint dapat berubah sewaktu-waktu; gunakan hanya akun merchant milik sendiri.</p>
      <p class="muted" style="font-size:12px;"><b>Wajib diisi:</b> <code>QRIS_INTERACTIVE_APP_EMAIL</code> (email login aplikasi mobile QRIS Interactive). Isi <code>QRIS_INTERACTIVE_APP_PIN</code> hanya jika aplikasi meminta PIN. <code>QRIS_INTERACTIVE_APP_MID</code> opsional untuk memilih lokasi merchant tertentu dari akun.</p>
      <p class="muted" style="font-size:11px;">Invoice ID dan refNo dari provider disimpan pada transaksi. POS hanya mengubah <code>PENDING → PAID</code> setelah endpoint cek invoice mengembalikan bukti tanggal sukses dan RRN. Jangan gunakan kredensial dashboard web jika akun tersebut tidak bisa login ke aplikasi mobile.</p>
    </div>
    <div class="card"><table>
    ${settings.filter(s=>!settingLabels[s.key]).map(s=>`<tr><td style="white-space:nowrap;vertical-align:top;padding-top:10px;">${s.key}</td>
      <td>${isMultiline(s.key)
        ? `<textarea id="set-${s.key}" rows="4" placeholder="${s.configured ? '🔒 Tersimpan — tempel nilai baru untuk mengganti' : ''}" style="margin:0;font-family:monospace;font-size:12px;">${escapeHtmlAttr(s.value)}</textarea>`
        : `<input type="${['QRIS_INTERACTIVE_PASSWORD','QRIS_INTERACTIVE_APP_PIN'].includes(s.key) ? 'password' : 'text'}" value="${escapeHtmlAttr(s.value)}" id="set-${s.key}" style="margin:0;">`}</td>
      <td style="vertical-align:top;"><button class="secondary" style="padding:4px 8px;" onclick="saveSetting('${s.key}')">Simpan</button></td></tr>`).join('')}
    </table></div>`;
}
async function saveSetting(key) {
  try { await api('PUT', `/admin/settings/${key}`, { value: document.getElementById(`set-${key}`).value }); await alertDialog('Tersimpan.'); if (['QRIS_INTERACTIVE_PASSWORD','QRIS_INTERACTIVE_APP_PIN'].includes(key)) renderSettings(); }
  catch (e) { await alertDialog(e.message); }
}

// ---------------- Audit Log ----------------
async function renderAudit() {
  const logs = await api('GET','/admin/audit-log');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const describe = value => {
    if (!value) return '-';
    try { const parsed = typeof value === 'string' ? JSON.parse(value) : value; return esc(JSON.stringify(parsed)); }
    catch (_) { return esc(value); }
  };
  document.getElementById('view').innerHTML = `<h2>Audit Log</h2><div class="card"><p class="muted">Mencatat login/logout, aktivitas kasir, absensi, dan perubahan data. Aktivitas akun staff ditampilkan berdasarkan username dan nama karyawan.</p><table>
    <tr><th>Tanggal &amp; Jam (WIB)</th><th>Akun / Actor</th><th>Action</th><th>Module</th><th>Record</th><th>Detail</th></tr>
    ${logs.map(l=>`<tr><td>${esc(formatJakartaDateTime(l.timestamp))}</td><td>${esc(l.actor_username || (l.actor_id ? `ID ${l.actor_id}` : 'System'))}${l.actor_role ? ` <small>(${esc(l.actor_role)})</small>` : ''}${l.actor_employee_name ? `<br><small>${esc(l.actor_employee_name)}</small>` : ''}</td><td>${esc(l.action)}</td><td>${esc(l.module)}</td><td>${esc(l.record_id||'-')}</td><td style="max-width:360px;overflow-wrap:anywhere">${describe(l.new_value || l.old_value)}</td></tr>`).join('')}
    </table></div>`;
}

// ---------------- Utilities ----------------

  const today = jakartaISODate();
  const [items, employees] = await Promise.all([
    api('GET', `/admin/utilities?from=2000-01-01&to=2100-01-01`),
    api('GET', '/admin/employees'),
  ]);
  document.getElementById('view').innerHTML = `<h2>Utilities (Pengeluaran / Pemasukan Harian)</h2>
    <div class="card"><h3>Tambah Entry</h3>
      <input id="utDate" type="date" value="${today}">
      <input id="utDesc" placeholder="Deskripsi (contoh: Sewa listrik harian, Beli gas, Kasbon lunas)">
      <input id="utCategory" placeholder="Kategori (opsional)">
      <select id="utType"><option value="DEBIT">Pengeluaran</option><option value="KREDIT">Pemasukan</option></select>
      <input id="utAmount" type="number" placeholder="Nominal">
      <select id="utEmployee">
        <option value="">Tidak terkait karyawan</option>
        ${employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}
      </select>
      <p class="muted" style="font-size:12px;">Pilih karyawan jika entry ini adalah kasbon/pengeluaran pribadi — nominal DEBIT akan otomatis mengurangi gapok karyawan tsb saat payroll dihitung untuk periode yang mencakup tanggal ini.</p>
      <button onclick="addUtility()">Simpan</button>
      <button class="secondary" onclick="openBulkUtilities()">Upload Bulk (Excel)</button>
    </div>
    <div class="card"><table><tr><th>Tanggal</th><th>Deskripsi</th><th>Kategori</th><th>Tipe</th><th>Nominal</th><th>Karyawan</th><th>Aksi</th></tr>
    ${items.map(u=>`<tr><td>${u.date}</td><td>${u.description}</td><td>${u.category||'-'}</td>
      <td><span class="tag ${u.type==='DEBIT'?'low':'paid'}">${u.type}</span></td><td>${rupiah(u.amount)}</td>
      <td>${u.employee_name || '-'}</td>
      <td><button class="secondary" style="padding:4px 8px;color:#c0392b;" onclick="deleteUtility(${u.id})">Hapus</button></td></tr>`).join('')}
    ${!items.length ? '<tr><td colspan="7" class="muted">Belum ada data.</td></tr>' : ''}
    <tr style="font-weight:700;border-top:2px solid #ddd;"><td colspan="4">TOTAL UTILITIES</td><td>${formatUtilitiesAmount(items.reduce((s,u)=>s+(u.type==='DEBIT'?u.amount:-u.amount),0))}</td><td colspan="2"></td></tr>
    </table></div>`;
}
async function addUtility() {
  const date = document.getElementById('utDate').value;
  const description = document.getElementById('utDesc').value;
  const category = document.getElementById('utCategory').value;
  const type = document.getElementById('utType').value;
  const amount = Number(document.getElementById('utAmount').value);
  const employee_id = document.getElementById('utEmployee').value || null;
  if (!date || !description || !amount) return alertDialog('Lengkapi tanggal, deskripsi, dan nominal.');
  await api('POST', '/admin/utilities', { date, description, category, type, amount, employee_id });
  renderUtilities();
}
async function deleteUtility(id) {
  const ok = await confirmDialog('Hapus entry ini?');
  if (!ok) return;
  await api('DELETE', `/admin/utilities/${id}`);
  renderUtilities();
}
async function openBulkUtilities() {
  const xlsxBase64 = await uploadExcelDialog('Upload Bulk Utilities',
    'Kolom wajib: date, description, type (DEBIT/KREDIT), amount. category dan employee_name opsional.',
    '/api/admin/utilities/bulk/template.xlsx');
  if (!xlsxBase64) return;
  try {
    const r = await api('POST', '/admin/utilities/bulk', { xlsxBase64 });
    const errMsg = r.errors.length ? `\n${r.errors.length} baris gagal: ` + r.errors.map(e=>`baris ${e.row}: ${e.error}`).join('; ') : '';
    await alertDialog(`${r.createdCount} entry berhasil dibuat.${errMsg}`);
    renderUtilities();
  } catch (e) { await alertDialog('Gagal upload: ' + e.message); }
}

// ---------------- Reports ----------------
let reportFilters = { paymentMethod: '', paymentStatus: '', cashierId: '' };
async function renderReports() {
  const cashiers = await api('GET', '/pos/cashiers');
  const today = jakartaISODate();
  const monthStart = today.slice(0, 8) + '01';
  document.getElementById('view').innerHTML = `<h2>Reports</h2>
    <div class="card">
      <div class="grid2">
        <input id="rFrom" type="date" value="${monthStart}"><input id="rTo" type="date" value="${today}">
      </div>
      <div class="grid3" style="margin-top:8px;">
        <select id="rFilterMethod">
          <option value="">Semua Metode</option>
          <option value="CASH" ${reportFilters.paymentMethod==='CASH'?'selected':''}>Cash</option>
          <option value="QRIS" ${reportFilters.paymentMethod==='QRIS'?'selected':''}>QRIS</option>
        </select>
        <select id="rFilterStatus">
          <option value="">Semua Status</option>
          <option value="PAID" ${reportFilters.paymentStatus==='PAID'?'selected':''}>PAID</option>
          <option value="PENDING" ${reportFilters.paymentStatus==='PENDING'?'selected':''}>PENDING</option>
          <option value="VOID" ${reportFilters.paymentStatus==='VOID'?'selected':''}>VOID</option>
          <option value="FAILED" ${reportFilters.paymentStatus==='FAILED'?'selected':''}>FAILED</option>
          <option value="CANCELLED" ${reportFilters.paymentStatus==='CANCELLED'?'selected':''}>CANCELLED</option>
        </select>
        <select id="rFilterCashier">
          <option value="">Semua Kasir</option>
          ${cashiers.map(c=>`<option value="${c.id}" ${String(reportFilters.cashierId)===String(c.id)?'selected':''}>${c.username}</option>`).join('')}
        </select>
      </div>
      <button onclick="loadReports()" style="margin-top:8px;">Generate Report Penjualan & Profit</button>
      <button class="secondary" onclick="downloadReportExcel()" style="margin-top:8px;">⬇ Download Excel</button>
    </div>
    <div id="reportResult"><div class="card muted">Pilih rentang tanggal dan filter yang diperlukan, lalu klik <strong>Generate Report Penjualan &amp; Profit</strong> untuk menampilkan data.</div></div>`;
}
function currentReportQuery() {
  const from = document.getElementById('rFrom').value, to = document.getElementById('rTo').value;
  reportFilters.paymentMethod = document.getElementById('rFilterMethod').value;
  reportFilters.paymentStatus = document.getElementById('rFilterStatus').value;
  reportFilters.cashierId = document.getElementById('rFilterCashier').value;
  const query = new URLSearchParams({ from, to });
  if (reportFilters.paymentMethod) query.set('paymentMethod', reportFilters.paymentMethod);
  if (reportFilters.paymentStatus) query.set('paymentStatus', reportFilters.paymentStatus);
  if (reportFilters.cashierId) query.set('cashierId', reportFilters.cashierId);
  return { from, to, query };
}
async function downloadReportExcel() {
  const { from, to, query } = currentReportQuery();
  if (!from || !to) return alertDialog('Pilih rentang tanggal.');
  window.open(`/api/admin/reports/export?${query.toString()}`, '_blank');
}
async function loadReports() {
  const { from, to, query } = currentReportQuery();
  if (!from || !to || from > to) return alertDialog('Pilih rentang tanggal yang valid.');
  const result = document.getElementById('reportResult');
  result.innerHTML = '<div class="card">Memuat laporan penjualan dan profit...</div>';
  try {
    const [sales, products, trxReport, profitReport] = await Promise.all([
      api('GET', `/admin/reports/sales?from=${from}&to=${to}`),
      api('GET', `/admin/reports/products?from=${from}&to=${to}`),
      api('GET', `/admin/reports/transactions?${query.toString()}`),
      api('GET', `/admin/reports/profit?from=${from}&to=${to}`),
    ]);
    const { rows: trxGrid, summary } = trxReport;
    const tagClass = status => status==='PAID'?'paid':status==='VOID'?'void':'pending';
    const profit = profitReport.rows || [];
    const ps = profitReport.summary || { qty:0, revenue:0, hpp:0, grossProfit:0, margin:0 };
    result.innerHTML = `
      <div class="grid2">
        <div class="card"><h3>Ringkasan Penjualan</h3>
          <p>Total Revenue (PAID): <strong>${rupiah(ps.revenue)}</strong></p>
          <p>Total Qty Terjual: <strong>${ps.qty}</strong></p>
          <p>Transaksi sesuai filter: <strong>${summary.count}</strong></p>
        </div>
        <div class="card"><h3>Ringkasan Profit Kotor</h3>
          <p>Total HPP: <strong>${rupiah(ps.hpp)}</strong></p>
          <p>Profit Kotor: <strong>${rupiah(ps.grossProfit)}</strong></p>
          <p>Biaya Operasional (net): <strong>${rupiah(ps.operatingExpenses||0)}</strong></p>
          <p>Profit Bersih Estimasi: <strong>${rupiah(ps.netProfit||0)}</strong></p>
          <p>Margin Kotor: <strong>${(Number(ps.margin||0)*100).toFixed(2)}%</strong> · Margin Bersih: <strong>${(Number(ps.netMargin||0)*100).toFixed(2)}%</strong></p>
          <p class="muted" style="font-size:12px;">HPP dihitung dari resep aktif × harga satuan bahan saat ini; bukan snapshot harga historis.</p>
        </div>
      </div>
      <div class="grid2">
        <div class="card"><h3>Sales per Hari</h3><table><tr><th>Tanggal</th><th>Transaksi</th><th>Revenue</th></tr>
          ${sales.map(row=>`<tr><td>${row.date}</td><td>${row.transactions}</td><td>${rupiah(row.revenue)}</td></tr>`).join('')}
          ${!sales.length?'<tr><td colspan="3" class="muted">Tidak ada penjualan PAID pada periode ini.</td></tr>':''}</table></div>
        <div class="card"><h3>Per Produk</h3><table><tr><th>Menu</th><th>Qty</th><th>Revenue</th></tr>
          ${products.map(row=>`<tr><td>${row.name}</td><td>${row.qty}</td><td>${rupiah(row.revenue)}</td></tr>`).join('')}
          ${!products.length?'<tr><td colspan="3" class="muted">Tidak ada produk terjual pada periode ini.</td></tr>':''}</table></div>
      </div>
      <div class="card"><h3>Report Penjualan & Profit per Menu</h3><table>
        <tr><th>Menu</th><th>Qty</th><th>Revenue</th><th>HPP/Unit</th><th>Total HPP</th><th>Profit Kotor</th><th>Margin</th></tr>
        ${profit.map(row=>`<tr><td>${row.name}</td><td>${row.qty}</td><td>${rupiah(row.revenue)}</td><td>${rupiah(row.unit_hpp)}</td><td>${rupiah(row.total_hpp)}</td><td>${rupiah(row.gross_profit)}</td><td>${Number(row.revenue)>0?(Number(row.gross_profit)/Number(row.revenue)*100).toFixed(2):'0.00'}%</td></tr>`).join('')}
        ${!profit.length?'<tr><td colspan="7" class="muted">Tidak ada transaksi PAID pada periode ini.</td></tr>':''}
        <tr style="font-weight:700;border-top:2px solid #ddd;"><td>TOTAL</td><td>${ps.qty}</td><td>${rupiah(ps.revenue)}</td><td></td><td>${rupiah(ps.hpp)}</td><td>${rupiah(ps.grossProfit)}</td><td>${(Number(ps.margin||0)*100).toFixed(2)}%</td></tr>
      </table></div>
      <div class="card"><h3>Rincian Biaya Operasional</h3><table>
        <tr><th>Kategori</th><th>Dampak Biaya</th></tr>
        ${(profitReport.utilities||[]).map(u=>`<tr><td>${u.category}</td><td>${rupiah(u.net_amount)}</td></tr>`).join('')}
        ${!(profitReport.utilities||[]).length?'<tr><td colspan="2" class="muted">Tidak ada biaya operasional pada periode ini.</td></tr>':''}
        <tr style="font-weight:700"><td>Total Biaya Operasional (net)</td><td>${rupiah(ps.operatingExpenses||0)}</td></tr>
        <tr style="font-weight:700"><td>Profit Bersih Estimasi</td><td>${rupiah(ps.netProfit||0)}</td></tr>
      </table></div>
      <div class="card"><h3>Detail Penjualan per Transaksi</h3><table>
        <tr><th>No</th><th>Tanggal</th><th>Kasir</th><th>Menu Dibeli</th><th>Total</th><th>Pembayaran</th><th>Status</th></tr>
        ${trxGrid.map(t=>`<tr onclick="showTrxDetail(${t.id})" style="cursor:pointer;">
          <td>${t.trx_no}</td><td>${t.date} ${t.time}</td><td>${t.cashier_name||'-'}</td><td>${t.menu_summary||'-'}</td><td>${rupiah(t.grand_total)}</td>
          <td>${t.payment_method}</td><td><span class="tag ${tagClass(t.payment_status)}">${t.payment_status}</span></td></tr>`).join('')}
        ${!trxGrid.length ? '<tr><td colspan="7" class="muted">Tidak ada transaksi pada rentang ini.</td></tr>' : ''}
        <tr style="font-weight:700;border-top:2px solid #ddd;"><td colspan="4">TOTAL PENDAPATAN (PAID)</td><td>${rupiah(summary.totalRevenue)}</td><td colspan="2"></td></tr>
      </table></div>`;
  } catch (e) {
    result.innerHTML = `<div class="card error">Gagal memuat laporan: ${e.message}</div>`;
  }
}

async function route() {
  const tab = (location.hash || '#dashboard').slice(1);
  setActiveTab(tab);
  const renderers = {
    dashboard: renderDashboard, pos: renderPos, transactions: renderTransactions,
    menu: renderMenu, recipe: renderRecipe, inventory: renderInventory,
    utilities: renderUtilities,
    employees: renderEmployees, schedule: renderSchedule, attendance: renderAttendance, payroll: renderPayroll,
    users: renderUsers, roles: renderRoles, settings: renderSettings, audit: renderAudit, reports: renderReports,
  };
  (renderers[tab] || renderDashboard)();
}
window.addEventListener('hashchange', route);

(async () => {
  me = await requireSession(['ADMIN']);
  if (me) route();
})();
</script>
