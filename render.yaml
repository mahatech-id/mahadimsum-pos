services:
  - type: web
    name: mahadimsum-pos
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Jakarta
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
